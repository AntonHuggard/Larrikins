{% extends 'larrbase.html' %}
{% load static %}

{% block content %}
<div id="main">
    <img 
        src="{% static img %}" 
        {% if alt_text is not None %} title="{{alt_text}}" {% endif %}
        >
    <h3>{{ title }}</h3>
    <h4 class="upload-date">{{ uploaded|date:'F, Y' }}</h4>
    <nav>
        <a href="/1">First</a>
        <a href="{{ prev }}">Prev</a>
        <a href="{% url 'random' %}">Random</a>
        <a href="{{ next }}">Next</a>
        <a href="{{ last }}">Last</a>
    </nav>
</div>

{% endblock %}
